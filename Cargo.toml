[package]
name = "pop-engine"
version = "0.1.0"
edition = "2021"
description = "Headless Rust/WebAssembly game engine for the Pop balloon arcade game"
license = "CC0-1.0"

[lib]
name = "pop_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3
